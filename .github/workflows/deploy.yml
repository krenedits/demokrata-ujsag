name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      # The WebP renditions are gitignored build output. Regenerating all 545
      # takes ~65s, so cache them against the inputs that determine their
      # content; `yarn build` then finds them present and skips the work.
      - uses: actions/cache@v4
        with:
          path: public/images/**/*_m.webp
          key: webp-${{ hashFiles('scripts/generateResponsiveImages.js', 'src/fileList.json') }}

      - run: yarn lint

      - run: yarn vitest run

      - run: yarn build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
